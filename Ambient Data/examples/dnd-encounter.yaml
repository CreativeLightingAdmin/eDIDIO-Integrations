# D&D / tabletop encounter triggers — fire spell & battle lighting from your VTT.
#
# The webhook source listens for POSTs; wire a Foundry VTT macro / module (or
# Roll20 script) to POST {"event": "combat_start"} etc. to
# http://<this-host>:8100/ . An event mapping maps each to a scene/effect.
#
# Example DM buttons: combat, fireball, healing, night, dawn.

controller:
  host: 192.168.1.50
  port: 23
  use_tls: false

source:
  type: webhook
  name: "VTT events"
  host: 0.0.0.0
  port: 8100
  label_path: "event"
  token: "changeme"        # POST to ?token=changeme

mapping:
  type: event
  events:
    combat_start: { kind: spektra, type: sequence, zone: 1, index: 0, action: start }
    fireball:     { kind: dmx_color, line: 2, rgb: [255, 60, 0] }
    healing:      { kind: dmx_color, line: 2, rgb: [120, 255, 160] }
    night:        { kind: dali_scene, line: 1, scene: 2 }
    dawn:         { kind: dali_scene, line: 1, scene: 1 }
    combat_end:   { kind: dali_scene, line: 1, scene: 1 }

min_interval: 0.1
