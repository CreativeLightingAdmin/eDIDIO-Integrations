# ISS Overhead Tracker — a slow white pulse when the International Space Station
# passes near your location.
#
# The iss_overhead source polls the ISS position (Open Notify) and emits a
# "proximity" value (0 when far, up to radius_km directly overhead). A threshold
# fires an overhead scene/sequence when it's within range.

controller:
  host: 192.168.1.50
  port: 23
  use_tls: false

source:
  type: iss_overhead
  name: "ISS overhead"
  lat: -37.8136          # your latitude  (this example: Melbourne)
  lon: 144.9631          # your longitude
  radius_km: 600         # "overhead" if within this many km
  interval: 20           # seconds between position checks

mapping:
  type: threshold
  bands:
    - min: 0             # far away -> calm scene
      action: { kind: dali_scene, line: 1, scene: 1 }
    - min: 1             # within radius (proximity > 0) -> slow white sweep
      action: { kind: spektra, type: sequence, zone: 1, index: 0, action: start }

min_interval: 2
