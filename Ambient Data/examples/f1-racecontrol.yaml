# Live F1 race control — flash the room to match the flags.
#
# The f1_racecontrol source polls OpenF1's race_control feed and emits a flag
# label for each NEW message. An event mapping turns each into a lighting action:
# safety car -> orange, yellow -> yellow flash, green -> clear, red -> red,
# chequered -> celebration.
#
# Tip: OpenF1 serves live during sessions; you can also point `url` at a specific
# past session_key to replay.

controller:
  host: 192.168.1.50
  port: 23
  use_tls: false

source:
  type: f1_racecontrol
  name: "F1 race control"
  url: "https://api.openf1.org/v1/race_control"
  interval: 5

mapping:
  type: event
  events:
    safety_car:          { kind: dmx_color, line: 2, rgb: [255, 120, 0] }
    virtual_safety_car:  { kind: dmx_color, line: 2, rgb: [255, 180, 0] }
    yellow:              { kind: dmx_color, line: 2, rgb: [255, 230, 0] }
    double_yellow:       { kind: dmx_color, line: 2, rgb: [255, 200, 0] }
    red:                 { kind: dmx_color, line: 2, rgb: [255, 0, 0] }
    green:               { kind: dali_scene, line: 1, scene: 1 }
    clear:               { kind: dali_scene, line: 1, scene: 1 }
    chequered:           { kind: spektra, type: sequence, zone: 1, index: 0, action: start }

min_interval: 0.2
