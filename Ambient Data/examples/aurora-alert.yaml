# Space weather / Aurora alert — threshold scenes on the NOAA planetary Kp index.
# When geomagnetic activity climbs, recall increasingly dramatic scenes
# (calm -> watch -> a green/purple aurora show).
#
# NOAA publishes the Kp index as JSON (a 0-9 scale). This polls it and picks a
# band. (Endpoint shape varies; adjust json_path to the field you use.)

controller:
  host: 192.168.1.50
  port: 23
  use_tls: false

source:
  type: http_poll
  name: "NOAA Kp index"
  url: "https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json"
  # This product is an array of rows; the last row's Kp is at a known index.
  # Adjust to your chosen endpoint — see the README on picking a json_path.
  json_path: "1.1"
  interval: 300

mapping:
  type: threshold
  bands:
    - min: 0    # quiet
      action: { kind: dali_scene, line: 1, scene: 1 }
    - min: 5    # storm watch
      action: { kind: dali_scene, line: 1, scene: 4 }
    - min: 7    # strong storm -> aurora show (a SpektraPlus sequence)
      action: { kind: spektra, type: sequence, zone: 1, index: 0, action: start }

min_interval: 1
