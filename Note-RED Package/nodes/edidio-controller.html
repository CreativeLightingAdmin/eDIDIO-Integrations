<script type="text/javascript">
	RED.nodes.registerType('edidio-controller', {
		category: 'config',
		defaults: {
			name: { value: '' },
			host: { value: '', required: true },
			port: { value: '', validate: RED.validators.number(true) },
			useTLS: { value: false },
			heartbeatMs: { value: 7000, validate: RED.validators.number(true) },
		},
		label: function () {
			return this.name || (this.host ? 'eDIDIO @ ' + this.host : 'eDIDIO controller');
		},
	});
</script>

<script type="text/html" data-template-name="edidio-controller">
	<div class="form-row">
		<label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
		<input type="text" id="node-config-input-name" placeholder="Optional name" />
	</div>
	<div class="form-row">
		<label for="node-config-input-host"><i class="fa fa-server"></i> Host</label>
		<input type="text" id="node-config-input-host" placeholder="192.168.1.50" />
	</div>
	<div class="form-row">
		<label for="node-config-input-port"><i class="fa fa-plug"></i> Port</label>
		<input type="text" id="node-config-input-port" placeholder="23 (TCP) / 443 (TLS)" />
	</div>
	<div class="form-row">
		<label for="node-config-input-useTLS"><i class="fa fa-lock"></i> TLS</label>
		<input type="checkbox" id="node-config-input-useTLS" style="display:inline-block; width:auto; vertical-align:top;" />
		<span>Use TLS (port 443)</span>
	</div>
	<div class="form-row">
		<label for="node-config-input-heartbeatMs"><i class="fa fa-heartbeat"></i> Heartbeat</label>
		<input type="text" id="node-config-input-heartbeatMs" placeholder="7000" />
		<span>ms</span>
	</div>
</script>

<script type="text/html" data-help-name="edidio-controller">
	<p>Connection to a Control Freak eDIDIO controller. Shared by all eDIDIO action nodes.</p>
	<ul>
		<li><b>Host</b> — controller IP or hostname.</li>
		<li><b>Port</b> — leave blank for the default (23 plain TCP, 443 TLS).</li>
		<li><b>TLS</b> — connect over TLS on port 443.</li>
		<li><b>Heartbeat</b> — keep-alive interval in milliseconds (default 7000).</li>
	</ul>
	<p>The connection reconnects automatically with exponential backoff if it drops.</p>
</script>
