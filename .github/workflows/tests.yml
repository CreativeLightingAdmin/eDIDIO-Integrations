# Runs every suite in the repo (run-all-tests.sh) plus the shared engine's tests,
# and fails if any vendored copy has drifted from shared/.
#
# The engine (edidio_control_py) is checked out next to this repo — the same
# sibling layout run-all-tests.sh expects locally — and installed in editable
# mode, so integrations are always tested against the engine's current main.

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  all-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: eDIDIO-Integrations

      - uses: actions/checkout@v4
        with:
          repository: CreativeLightingAdmin/edidio_control_py
          path: edidio_control_py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install tclsh
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tcl

      - name: Install Python dependencies
        # Everything the Python suites import. Hardware-only extras (python-rtmidi,
        # krpc, gpiozero) are only used by the live run.py entry points.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./edidio_control_py
          python -m pip install pytest PyYAML "lupa>=2.0" "HAP-python>=5.0" "xknx>=3.0" \
            "paho-mqtt>=2.0" "pymodbus==3.8.6" "python-osc>=1.8" "mido>=1.3" \
            "mcp>=2.0" "requests>=2.28"

      - name: Run all suites
        working-directory: eDIDIO-Integrations
        run: bash ./run-all-tests.sh
