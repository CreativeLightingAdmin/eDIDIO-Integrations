name: edidio-light
components:
  - id: main
    capabilities:
      - id: switch
        version: 1
      - id: switchLevel
        version: 1
    categories:
      - name: Light
preferences:
  - name: controllerIp
    title: eDIDIO controller IP
    required: true
    preferenceType: string
    definition:
      stringType: text
      default: "192.168.1.50"
  - name: line
    title: Line (1-4)
    required: true
    preferenceType: integer
    definition:
      minimum: 1
      maximum: 4
      default: 1
  - name: address
    title: DALI address (0-63, if not a group)
    required: false
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 63
      default: 0
  - name: group
    title: DALI group (0-15, overrides address if set)
    required: false
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 15
      default: 0
